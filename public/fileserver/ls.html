<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="./css/main.css">

	<link rel="icon" type="image/png" href="/favicon.svg">

	<title>Файлы</title>

	<script type="module">

		Array.prototype.last = function() { return this[this.length - 1] }
		import { createApp } from './js/petite-vue.min.js'

		createApp({
			tree: [],
			async requestTree() {
				const password = localStorage.getItem('password') || prompt('Пароль')
				this.tree = await fetch('/api/files', {
					headers: {
						'Authorization': 'Basic ' + password
					}
				}).then(res => res.json())
			}
		}).mount()

	</script>
</head>
<body 
	v-data="requestTree()"
	@vue:mounted="requestTree()"
>
	<main class="tree" v-cloak>

		<div 
			class="node"
			v-for="node, index in tree"
			:class="{ 
				[node.type]: true, 
				'last': (tree[index+1] && tree[index+1].level < node.level)
						|| (tree[index+1] && tree[index+1].type === 'folder' && node.type === 'file')
			}"
			:style="{ 'margin-left': node.level * 4 + 'ch' }"
			
		>

			<a :href="node.path" v-if="node.type === 'file'" :title="node.size_readable">
				<img class="file-icon" :src="`/icons/high-contrast/${node.mime_extension}.svg`" height="22px">
				<span class="file-name">{{ node.name }}</span>
			</a>

			<div v-else class="folder-name" :href="node.path">{{ node.name }}/</div>

		</div>

		<p v-if="!tree.length">Авторизуйтесь</p>

	</main>
</body>

<style>
body {
	font-family: monospace;
	font-size: 20px;
}

.tree {
	margin-top: 4em;
	margin-bottom: 2em;
	max-width: 650px;
	padding: 0 2ch;
}

.node {
	line-height: 1;
}
	.node.last {
		margin-bottom: 1em;
	}

.folder, .file a {
	padding-bottom: 0.5em;
}

.file a {
	text-decoration: none;
	display: flex;
	gap: 1ch;
}
.file-name {
	padding-right: 4ch;
}
	.file:hover .file-name {
		text-decoration: underline;
		text-decoration-skip-ink: none;
		text-decoration-color: color-mix(in srgb, currentColor, transparent 60%);
	}

.file-icon {
	width: 2ch;
	user-select: none;
}
</style>
</html>
