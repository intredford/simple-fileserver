<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">


	<link rel="preload" href="/font/Inter/regular.woff2" as="font" type="font/woff2" crossorigin>

	<link rel="stylesheet" href="/font/Inter/style.css">
	<link rel="stylesheet" href="/css/main.css">
	<link rel="stylesheet" href="/css/index.css">

	<link rel="icon" type="image/png" href="/favicon.svg">

	<title>Загрузить файл</title>

	<script type="module">
		Array.prototype.last = function() { return this[this.length - 1] }
		import { createApp } from '/js/petite-vue.min.js'

		createApp({
			files: [ ],
			expiresAfter: 24,
			unexpirable: false,
			dragging: false,
			uploaded: false,
			error: false,
			errorText: '',

			get expirationDate() {
				if (this.unexpirable) return null
				return new Date(Date.now() + this.expiresAfter * 60 * 60 * 1000)
			},
			
			handleFiles(event) {
				const files = event.target.files
				console.log('new files', files)

				if (this.uploaded && files.length > 0) {
					this.files = []
					this.uploaded = false
				}

				for (let file of files) {

					file = {
						raw: file, // сам объект `File`
						path: file.name,
						progress: 0,
						previewError: false,
					}

					const hasPreview = (
						file.raw.type.includes('image')
						&& file.raw.size/1024/1024 < 10
						&& Array.from(files).filter(f => f.type.includes('image')).length < 200
					)

					if (hasPreview) {
						// Генерируем превью картинкам
						const reader = new FileReader()
						reader.onload = (e) => {
							file.preview = e.target.result
							this.files.push(file)
						}
						reader.readAsDataURL(file.raw)
					} else {
						// Извлекаем формат
						file.format = file.raw.name.split('.').last().toLowerCase()
						this.files.push(file)
					}
				}
			},

			handleDrop(event) {
				this.handleFiles({ 'target': { 'files': event.dataTransfer.files } })
				this.dragging = false
			},

			removeFile(index) {
				this.files.splice(index, 1)
			},

			setPreviewError(index) {
				this.files[index].previewError = true
				const files = [ ...this.files ]
				this.files = [  ]
				this.$nextTick(() => {
					this.files = [...files] // Обновляет список
				})
				// Способ говно, но другого я не придумал. Просто так первая строка не работает, $forceUpdate тут нет.
			},

			uploadFiles() {
				const xhr = new XMLHttpRequest() // fetch не поддерживает progress
				const form = new FormData()

				this.error = false
				this.errorText = ''

				const password = localStorage.getItem('password') || prompt('Пароль')

				form.append('expires_at', +this.expirationDate)

				this.files.forEach(file => {
					form.append(file.path.trim(), file.raw.name)
				})

				this.files.forEach(file => {
					form.append('files', file.raw)
				})

				xhr.upload.addEventListener('progress', event => {
					if (event.lengthComputable) {
						const progress = Math.round((event.loaded / event.total) * 100)
						this.files.forEach(file => { file.progress = progress })
					}
				})

				xhr.open('POST', '/api/upload')

				xhr.setRequestHeader('Authorization', 'Basic ' + (password))

				xhr.send(form)

				xhr.onload = () => {
					
					if (xhr.status === 200) {
						
						const response = JSON.parse(xhr.responseText);
						this.error = false

						response.forEach((file, i) => { // добавить ссылки и qr-коды
							this.files[i].link = file.link
							this.files[i].QRCode = file.QRCode
						})
						this.uploaded = true

						document.querySelectorAll('input[name="url"]').forEach(input => { // прокрутить все инпуты в конец
							input.focus()
							input.setSelectionRange(input.value.length, input.value.length)
							input.blur()
						})

					} else if (xhr.status === 401) {
						this.error = true
						this.errorText = xhr.responseText
					} else {
						this.error = true
						this.errorText = `Ошибка ${xhr.status}` + xhr.responseText ? `\n ${xhr.responseText}` : ''
					}
				}

			},

			hourLabel() {
				const hours = this.expiresAfter
				if (hours % 10 === 1 && hours % 100 !== 11) return "час"
				if (hours % 10 >= 2 && hours % 10 <= 4 && (hours % 100 < 10 || hours % 100 >= 20)) return "часа"
				return "часов"
			}
		}).mount()
	</script>
</head>

<body
	v-data="fileUpload()"
	@drop.prevent="handleDrop"
	@dragover.stop.prevent
	@click="dragging=false"
	@dragenter.stop="dragging=!!event.dataTransfer?.files"
	@dragleave.stop="dragging=false"
>

	<noscript class="noscript">
		<header>
			Включите JavaScript
		</header>
	</noscript>

	<form
		class="form"
		enctype="multipart/form-data"
		@submit.prevent="uploadFiles"
	>
		
		<div class="form-add">
			<input
				type="file"
				id="file-input"
				name="files"
				multiple
				accept="*/*"
				@input="handleFiles"
			>
			<label class="form-file" for="file-input">
				Выбрать файлы...
			</label>
			<div
				class="drag-n-drop"
				v-show="dragging"
			></div>
		</div>

		<label class="form-overlay" for="file-input" v-show="!files.length"></label>

		<div class="files" v-if="files.length">
			<div
				class="file"
				v-for="file, index in files"
			>

				<div class="file-preview">

					<img
						v-if="file.preview"
						:src="file.preview"
					>
					<img
						v-else-if="!file.previewError"
						class="icon"
						:src="`/icons/high-contrast/${file.format}.svg`"
						@error="setPreviewError(index)"
					>
					<span
						v-else-if="file.format.length <= 4"
						class="file-format"
						>
						{{ file.format }}
					</span>
					<img
						v-else
						class="icon"
						:src="`/icons/high-contrast/blank.svg`"
					>
				</div>

				<div class="file-name">
					<input
						v-model="file.link ? file.link : file.path"
						name="url"
						size="22"
						placeholder="URL файла"
						:title="file.QRCode ? 'Ссылка на файл' : 'Относительный адрес файла'"
						v-bind="file.link ? { readonly: true } : {}"
						required
					>
					<div class="file-progress">
						<div
							class="file-progress-value"
							:style="{
								width: error ? '0%' : file.progress + '%',
								'background-color': file.progress < 100 ? 'var(--color-blue)' : error ? 'red' : '#67d264'
							}"
							v-if="file.progress"
						></div>
					</div>
				</div>

				<div
					class="file-remove"
					v-if="!file.QRCode"
					role="button"
					tabindex="0"
					@click="removeFile(index)"
					title="Убрать файл"
				>✕</div>

				<img
					class="file-qrcode"
					:src="file.QRCode"
					alt="QR-код"
					v-else
				>

			</div>
		</div>

		<div class="form-field" :class="{'disabled': unexpirable}" v-if="files.length">
			<label for="expires-after">Удалить через</label>
			<input
				v-model="expiresAfter"
				:disabled="unexpirable"
				type="number"
				id="expires-after"
				name="expires-after"
				min="1"
				size="2"
				step="1"
				required
				style="appearance: textfield; height: 1.5em"
			>
			<label for="expires-after">{{ hourLabel() }}</label>
		</div>

		<div class="form-field" v-if="files.length">
			<input
				type="checkbox"
				id="unexpirable"
				name="unexpirable"
				v-model="unexpirable"
			><label for="unexpirable">Не удалять</label>
		</div>

		<button
			class="form-upload blue"
			type="submit"
			v-if="files.length"
		>
			Загрузить
		</button>

		<div class="form-message" v-if="error">
			<div class="form-error">
				Ошибка: {{ errorText }}
			</div>
		</div>
	
	</form>

</body>

</html>
