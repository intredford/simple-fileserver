<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="./css/main.css">

	<link rel="icon" type="image/png" href="/favicon.svg">

	<title>Текст</title>

	<script type="module">
		import { createApp } from './js/petite-vue.min.js'
		createApp({
			text: '',
			saving: false,
			error: '',
			saveTimer: null,
	
			async requestText() {
				const password = localStorage.getItem('password') || prompt('Пароль')
				this.text = await fetch('/api/note', {
					headers: {
						'Authorization': 'Basic ' + password
					}
				}).then(res => {
					const textarea = document.querySelector('textarea')
					textarea.focus()
					textarea.setSelectionRange(0, 0)
					return res.text()
				})
				.catch(error => { 
					this.text = ''
					this.error = error
				})
			},
	
			saveText() {
				clearTimeout(this.saveTimer)
				this.saveTimer = setTimeout(async () => {
					this.saving = true
					await fetch('/api/note', {
						method: 'POST',
						headers: {
							'Authorization': 'Basic ' + localStorage.getItem('password'),
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({ text: this.text })
					}).catch(error => { this.error = error })
					this.saving = false
				}, 200)
			},
	
			insertTab() {
				const textarea = document.querySelector('textarea')
				const start = textarea.selectionStart
				const end = textarea.selectionEnd
				const before = this.text.substring(0, start)
				const after = this.text.substring(end)
	
				this.text = before + '\t' + after
	
				this.$nextTick(() => {
					textarea.focus()
					textarea.setSelectionRange(start + 1, start + 1)
				})
			}
		}).mount()
	</script>
</head>
<body @vue:mounted="requestText()">
	<main class="text" v-cloak>
		<textarea v-model="text" spellcheck="false" @input="saveText" @keydown.tab.prevent="insertTab"></textarea>
		<div class="statusbar">
			<svg v-if="saving" viewBox="0 0 24 24" width="1em" height="1em"><g stroke="currentColor"><circle cx="12" cy="12" r="9.5" fill="none" stroke-linecap="round" stroke-width="3"><animate attributeName="stroke-dasharray" calcMode="spline" dur="1.5s" keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite" values="0 150;42 150;42 150;42 150"/><animate attributeName="stroke-dashoffset" calcMode="spline" dur="1.5s" keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite" values="0;-16;-59;-59"/></circle><animateTransform attributeName="transform" dur="1s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12"/></g></svg>
			<div v-if="error" style="color: red;">{{ error }}</div>
		</div>
	</main>
</body>

<style>
body {
	font-family: monospace;
	font-size: 18px;
	height: 100vh;
	overflow: hidden;
}
.text {
	width: 100%;
	height: 100%;
}
textarea {
	width: 100%;
	height: 100%;
	resize: none;
	outline: none;
	border: none;
	background-color: transparent;
	font-family: inherit;
	font-size: inherit;
	color: inherit;
	padding: 1em;
}
	textarea::selection {
		background-color: color-mix(in oklab, Highlight, transparent 70%);
	}

.statusbar {
	position: fixed;
	bottom: 0;
	left: 0;
	width: 100%;
	background-color: transparent;
	pointer-events: none;
	padding: 0 1rem;
	display: flex;
	justify-content: space-between;
	align-items: center;
	font-family: sans-serif;
	font-size: 16px;
	height: 1.5em;
	pointer-events: none;
}
</style>
</html>
